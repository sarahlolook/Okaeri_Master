<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>LIVE CHAT</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="../stylesheet.css">
        <script type="text/javascript" src="script.js"></script>
    </head>
    <body>
        <div class="navbar">
            <a class="header_text no_link_style" href="../index.html">Okaeri Master</a>
            <a href="../profile/myprofile.html">Profile</a>
            <a href="../feed/feed.html">Feed</a>
            <a href="../livechat/livechat.html">Chat</a>
            <a class="right" href="#Contact">LOG-OUT</a>
            <a class="right" href="#Works">Switch</a>
        </div>
        
        <!-- Phone navbar -->
        <div class="phone_navbar_top">
            <a class="header_text no_link_style" href="../index.html">Okaeri Master</a>
            <a class="right" href="#Works">Switch</a>
        </div>
        <div class="phone_navbar_btm">
            <a href="../profile/myprofile.html">Profile</a>
            <a href="../feed/feed.html">Feed</a>
            <a href="../livechat/livechat.html">Chat</a>
        </div>  

        <div class="page_content">
            <div class="card">
                <div class="viewpfp_card">
                    <button class="viewpfp_btn">
                        <img src="../images/manager1.png" class="viewpfp_img"
                            alt="preview">
                        <div class="viewpfp_info">
                        <a href="" class="no_link_style"><b>View Profile</b></a>
                    </div></button>
                </div>
                <div id="statusinfo">
                    <span>Connection: <span id="connection">Connected</span></span> | 
                    <span>Your ID: <span id="your_id">-</span></span>
                </div>
                <h1 class="header_text_cen">LIVE CHAT</h1>
                <div class="live_side">
                    <div class="gametab_card">
                        <button class="no_link_style gametab_btn">
                            <img src="../images/manager1.png" class="gametab_img"
                            alt="preview">serve</button>
                        <button class="no_link_style gametab_btn">
                            <img src="../images/manager1.png" class="gametab_img"
                            alt="preview">game</button>

                    </div>
                </div>
                <div class="live_main">
                    <div class="card_white_main" id="chatbox">
                        <div id="loginform">
                            <div id="menu">
                                <p class="welcome">Welcome,  <span id="username"></span></p>
                            </div>
                        </div>            
                    </div>
                    <div class="wrapper">      
                        <input name="userMsg" type="text" id="userMsg" placeholder="Type here.."/>
                        <button id="submitmsg" disabled>Send</button>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
