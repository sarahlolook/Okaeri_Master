<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>My Profile</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="stylesheet.css">
    </head>
    <body>
        <div class="navbar">
            <a class="header_text no_link_style" href="index.html">Okaeri Master</a>
            <a href="myprofile.html">Profile</a>
            <a href="feed.html">Feed</a>
            <a href="project.html">Chat</a>
            <a class="right" href="#Works">Works</a>
            <a class="right" href="#Contact">Contact</a>
        </div>
        
        <!-- Phone navbar -->
        <div class="phone_navbar_top">
            <a class="header_text no_link_style" href="index.html">Okaeri Master</a>
        </div>
        <div class="phone_navbar_btm">
            <a href="myprofile.html">Profile</a>
            <a href="feed.html">Feed</a>
            <a href="project.html">Chat</a>
            <a class="right" href="#Works">Works</a>
            <a class="right" href="#Contact">Contact</a>
        </div>

        <div class="page_content">
            <div class="side">
                <div class="card">
                    <h1 class="header_text_cen">Edit Profile</h1>
                    <form>
                        <fieldset>
                            <legend>Edit Profile</legend>
                            <img src="images/manager1.png" class="img_max"
                                alt="preview">
                            <!-- Username -->
                            <label for="username">Username</label>
                            <input type="text" id="username" name="username" required>
                            <br>
                
                            <!-- Role -->
                            Role
                            <div class="role-selection">
                                <label class="role-option">
                                    <input type="radio" name="role" value="master">
                                    Master
                                </label>
                
                                <label class="role-option">
                                    <input type="radio" name="role" value="maid">
                                    Maid
                                </label>
                            </div>
                
                            <!-- Favourite Cups -->
                            <fieldset>
                                <legend>Favourite Cups (Maximum 3)</legend>
                
                                <label>
                                    <input type="checkbox" name="fav_cup" value="cup1">
                                    Cup 1
                                </label>
                
                                <label>
                                    <input type="checkbox" name="fav_cup" value="cup2">
                                    Cup 2
                                </label>
                
                                <label>
                                    <input type="checkbox" name="fav_cup" value="cup3">
                                    Cup 3
                                </label>
                            </fieldset>
                
                            <br>
                            <button type="submit">Confirm</button>
                            <button type="reset">Reset</button>
                
                        </fieldset>
                    </form>
                </div>
            </div>
            <div class="main">
                <div class="card_white">
                    <h1 class="header_text_cen">Interest</h1>
                    <div class="feed_container">
                        <div class="card_white">
                            <button type="button"><a href="">Edit</a></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
            
    </body>
</html>
