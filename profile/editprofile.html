<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>My Profile</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="../stylesheet.css">
    </head>
    <body>
        <div class="navbar">
            <a class="header_text no_link_style" href="../index.html">Okaeri Master</a>
            <a href="../profile/myprofile.html">Profile</a>
            <a href="../feed/feed.html">Feed</a>
            <a href="../livechat/livechat.html">Chat</a>
            <a class="right" href="#Contact">LOG-OUT</a>
            <a class="right" href="#Works">Switch</a>
        </div>
        
        <!-- Phone navbar -->
        <div class="phone_navbar_top">
            <a class="header_text no_link_style" href="../index.html">Okaeri Master</a>
            <a class="right" href="#Works">Switch</a>
        </div>
        <div class="phone_navbar_btm">
            <a href="../profile/myprofile.html">Profile</a>
            <a href="../feed/feed.html">Feed</a>
            <a href="../livechat/livechat.html">Chat</a>
        </div>

        <div class="page_content">
            <div class="side">
                <form>
                    <fieldset>
                        <h1 class="header_text_cen">Edit Profile</h1>
                        <img src="../images/manager1.png" class="img_max" 
                            id="role-preview" alt="Role preview">
                        <!-- Username -->
                        <div>
                            Username
                            <input type="text" id="username" name="username" required>
                        </div><br>
            
                        <div class="role-selection">
                            Role
                            <label class="role-option">
                                <input type="radio" name="role" value="master">Master
                            </label>
                        
                            <label class="role-option">
                                <input type="radio" name="role" value="maid">Maid
                            </label>
                        </div>
                        <div class="cup-selection">
                            Fav Cup
                            <label>
                                <input type="radio" name="cup" value="cup1">Cup1
                            </label> <br>
                        </div> <hr>
                        Interest
                        <div class="interest-selection">
                            <label class="interest-option">
                                <input type="radio" name="interest" value="one">Interest
                            </label>
                            <label class="interest-option">
                                <input type="radio" name="interest" value="one">Interest2
                            </label>
                            <label class="interest-option">
                                <input type="radio" name="interest" value="one">Interest3
                            </label>
                        </div> <br>
            
                        <br>
                        <button type="submit">Confirm</button>
                        <button type="reset">Reset</button>
            
                    </fieldset>
                </form>
            </div>
            <div class="main">
                <div class="card_white">
                    <h1 class="header_text_cen">Interest</h1>
                    <div class="feed_container">
                        <div class="card_white">
                            <button type="button"><a href="">Edit</a></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script type="text/javascript" src="editprofile.js"></script>       
    </body>
</html>
